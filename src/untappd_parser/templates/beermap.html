<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Beer Map</title>
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://tiles.openfreemap.org; img-src 'self' data: blob:; worker-src blob: https://cdn.jsdelivr.net; child-src blob: https://cdn.jsdelivr.net; font-src 'self' data:;"
		>
		<link rel="preconnect" href="https://cdn.jsdelivr.net">
		<link rel="preconnect" href="https://tiles.openfreemap.org">
		<!--
			The import map must precede the modulepreload links. On MapLibre upgrades,
			update the version and hashes here and in the map script together.
		-->
		<script type="importmap">
		{
			"integrity": {
				"https://cdn.jsdelivr.net/npm/maplibre-gl@6.0.0/dist/maplibre-gl.mjs": "sha384-o0HSfwnZ3xgly1lTfmbCNdcKcrVf90axLIhCivtv4Jwg8TEr7CJkzuZORZzyyTrd",
				"https://cdn.jsdelivr.net/npm/maplibre-gl@6.0.0/dist/maplibre-gl-shared.mjs": "sha384-aHu4OL47vGZcFCmoNz74WH3dXW8SVwMMIsouH6aVLWMlp7aRDAXBjCe+UVzGGz4+"
			}
		}
		</script>
		<link
			rel="modulepreload"
			href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.0.0/dist/maplibre-gl.mjs"
			integrity="sha384-o0HSfwnZ3xgly1lTfmbCNdcKcrVf90axLIhCivtv4Jwg8TEr7CJkzuZORZzyyTrd"
			crossorigin="anonymous"
		>
		<link
			rel="modulepreload"
			href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.0.0/dist/maplibre-gl-shared.mjs"
			integrity="sha384-aHu4OL47vGZcFCmoNz74WH3dXW8SVwMMIsouH6aVLWMlp7aRDAXBjCe+UVzGGz4+"
			crossorigin="anonymous"
		>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.0.0/dist/maplibre-gl.css"
			integrity="sha384-zQW/aoM779xpmLohKxjpi3B0MrGyt7GfcBEOcLsAF5JOXTWlJqV9iiC8KuMQVRSG"
			crossorigin="anonymous"
		>
		<style>
			:root {
				--panel-bg: rgba(255, 255, 255, 0.97);
				--panel-text: #333;
				--panel-muted: #666;
				--panel-border: rgba(0, 0, 0, 0.12);
				--control-bg: rgba(0, 0, 0, 0.045);
				--selected-bg: #fff;
				--accent-text: #fff;
				--accent: #C2410C;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--panel-bg: rgba(28, 28, 28, 0.97);
					--panel-text: #eee;
					--panel-muted: #aaa;
					--panel-border: rgba(255, 255, 255, 0.12);
					--control-bg: rgba(255, 255, 255, 0.055);
					--selected-bg: #484848;
					--accent-text: #241a08;
					--accent: #F59E0B;
				}
				.style-control .style-options {
					background: #1c1c1c;
				}
				.maplibregl-popup-content {
					background: #262626;
					color: #eee;
				}
				.maplibregl-popup-close-button {
					color: #eee;
				}
				.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
				.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
				.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip {
					border-top-color: #262626;
				}
				.maplibregl-popup-anchor-top .maplibregl-popup-tip,
				.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
				.maplibregl-popup-anchor-top-right .maplibregl-popup-tip {
					border-bottom-color: #262626;
				}
				.maplibregl-popup-anchor-left .maplibregl-popup-tip {
					border-right-color: #262626;
				}
				.maplibregl-popup-anchor-right .maplibregl-popup-tip {
					border-left-color: #262626;
				}
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			#map {
				height: 100%;
			}
			/* .view-toggle and .time-control set display, which beats the UA hidden rule. */
			[hidden] {
				display: none !important;
			}
			.panel {
				background: var(--panel-bg);
				border: 1px solid var(--panel-border);
				border-radius: 12px;
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
				font-family: system-ui, -apple-system, sans-serif;
				font-size: 13px;
				color: var(--panel-text);
			}
			.sibling {
				background: transparent;
				border: none;
				box-shadow: none;
			}
			.sibling a {
				color: var(--accent);
				text-decoration: none;
				font-weight: 600;
			}
			.sibling a:hover {
				text-decoration: underline;
			}
			.top-left {
				display: flex;
				flex-direction: column;
				gap: 12px;
				box-sizing: border-box;
				padding: 16px;
			}
			.map-sidebar {
				position: absolute;
				top: 12px;
				left: 12px;
				z-index: 1;
				width: 320px;
				max-height: calc(100dvh - var(--map-footer-height, 24px) - var(--time-control-height, 134px) - 36px);
				overflow-y: auto;
				overscroll-behavior: contain;
				border-radius: 12px;
			}
			.stats {
				font-variant-numeric: tabular-nums;
			}
			.results-heading,
			.filter-actions,
			.sheet-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
			}
			#checkin-count {
				font-size: 18px;
				font-weight: 600;
				letter-spacing: -0.3px;
			}
			#location-counts {
				margin-top: 4px;
				font-size: 12px;
				line-height: 1.6;
				color: var(--panel-muted);
			}
			#display-summary {
				display: none;
				margin-top: 4px;
				font-size: 12px;
				color: var(--panel-muted);
			}
			#display-controls,
			#filter-fields {
				display: grid;
				gap: 12px;
			}
			#desktop-filters:has(> [hidden]) {
				display: none;
			}
			.control-group {
				display: grid;
				align-items: center;
				gap: 6px;
			}
			.control-label {
				font-size: 13px;
				color: var(--panel-muted);
			}
			.view-toggle {
				display: flex;
				gap: 2px;
				padding: 3px;
				border-radius: 8px;
				background: var(--control-bg);
			}
			.view-toggle button {
				flex: 1;
				min-width: 0;
				border: none;
				background: transparent;
				color: var(--panel-text);
				font: inherit;
				padding: 8px 2px;
				border-radius: 8px;
				cursor: pointer;
			}
			.view-toggle button:hover:not(.active) {
				background: var(--control-bg);
			}
			.view-toggle button.active {
				background: var(--accent);
				color: var(--accent-text);
			}
			#view-toggle button.active,
			#serving-all.active {
				background: var(--selected-bg);
				color: var(--panel-text);
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
			}
			.style-control input {
				box-sizing: border-box;
				min-width: 0;
				width: 100%;
				background: var(--control-bg);
				color: var(--panel-text);
				font: inherit;
				border: 1px solid var(--panel-border);
				border-radius: 8px;
				padding: 10px 32px 10px 12px;
				color-scheme: light dark;
			}
			.style-control input::placeholder {
				color: var(--panel-muted);
				opacity: 1;
			}
			.style-chevron {
				position: absolute;
				top: 14px;
				right: 14px;
				width: 7px;
				height: 7px;
				border-right: 1.5px solid currentColor;
				border-bottom: 1.5px solid currentColor;
				transform: rotate(45deg);
				pointer-events: none;
			}
			.style-picker {
				position: relative;
				min-width: 0;
			}
			.style-options {
				position: relative;
				max-height: min(240px, 35vh);
				overflow-y: auto;
				margin: 4px 0 0;
				padding: 4px;
				list-style: none;
				border: 1px solid var(--panel-border);
				border-radius: 8px;
				background: #fff;
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
			}
			.style-options li {
				padding: 8px;
				border-radius: 4px;
				cursor: pointer;
			}
			.style-options li[aria-selected="true"] {
				background: var(--control-bg);
				outline: 1px solid var(--accent);
			}
			.coverage {
				font-size: 11px;
				line-height: 1.5;
				color: var(--panel-muted);
			}
			#reset-filters {
				border: none;
				background: transparent;
				color: var(--panel-muted);
				font: inherit;
				font-size: 12px;
				padding: 4px;
				cursor: pointer;
			}
			.panel :is(button, input, a):focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.legend {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 8px 14px;
				font-size: 12px;
			}
			.visually-hidden {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
			.legend-row {
				display: flex;
				align-items: center;
				gap: 6px;
				line-height: 1.6;
			}
			.legend-dot {
				flex-shrink: 0;
				border-radius: 50%;
				border: 1.5px solid #fff;
				box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
			}
			#legend-info {
				margin-left: auto;
				width: 28px;
				height: 28px;
				padding: 0;
				border: 1px solid var(--panel-border);
				border-radius: 50%;
				background: transparent;
				color: var(--panel-muted);
				cursor: pointer;
				font: inherit;
			}
			#legend-clusters {
				flex-basis: 100%;
			}
			.filter-actions {
				border-top: 1px solid var(--panel-border);
				padding-top: 10px;
			}
			#filters-button,
			#close-filters {
				border: none;
				border-radius: 8px;
				padding: 8px 10px;
				background: var(--control-bg);
				color: var(--panel-text);
				font: inherit;
				font-weight: 500;
				cursor: pointer;
			}
			#filters-button::after {
				content: "⌄";
				margin-left: 8px;
			}
			#filters-button[aria-expanded="true"]::after {
				content: "⌃";
			}
			#filter-chips {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			#filter-chips button {
				max-width: 100%;
				border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
				border-radius: 8px;
				background: color-mix(in srgb, var(--accent) 10%, transparent);
				color: var(--panel-text);
				padding: 6px 8px;
				font: inherit;
				font-size: 12px;
				cursor: pointer;
				text-align: left;
				overflow-wrap: anywhere;
			}
			#filter-chips button::after {
				content: "×";
				margin-left: 8px;
				color: var(--accent);
			}
			#filter-sheet {
				box-sizing: border-box;
				width: 100%;
				max-width: none;
				max-height: 60dvh;
				margin: auto 0 0;
				padding: 0;
				border-radius: 16px 16px 0 0;
				overscroll-behavior: contain;
			}
			#filter-sheet::backdrop {
				background: rgba(0, 0, 0, 0.45);
			}
			.sheet-header {
				position: sticky;
				top: 0;
				z-index: 4;
				padding: 12px 16px;
				background: var(--panel-bg);
				border-bottom: 1px solid var(--panel-border);
			}
			.sheet-header h2 {
				margin: 0;
				font-size: 16px;
			}
			#sheet-controls {
				display: grid;
				gap: 16px;
				padding: 16px 16px max(16px, env(safe-area-inset-bottom));
			}
			#sheet-controls #filter-fields {
				border-top: 1px solid var(--panel-border);
				padding-top: 16px;
			}
			.time-control {
				position: absolute;
				bottom: max(calc(var(--map-footer-height, 24px) + 12px), env(safe-area-inset-bottom));
				left: 50%;
				transform: translateX(-50%);
				z-index: 1;
				display: grid;
				grid-template-columns: 32px minmax(0, 1fr);
				box-sizing: border-box;
				width: min(480px, calc(100vw - 24px));
				align-items: center;
				column-gap: 12px;
				row-gap: 4px;
				padding: 12px 16px;
			}
			.time-control button {
				border: none;
				background: transparent;
				color: var(--panel-text);
				font: inherit;
				padding: 4px 0;
				cursor: pointer;
			}
			.time-header {
				grid-column: 1 / -1;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
			}
			.time-control .time-label {
				font-weight: 600;
				text-align: left;
			}
			#dates-button {
				display: none;
			}
			#reset-dates {
				flex-shrink: 0;
			}
			#reset-dates {
				font-size: 12px;
				color: var(--panel-muted);
			}
			#reset-dates:hover {
				color: var(--panel-text);
			}
			#play-button {
				width: 32px;
				height: 32px;
				border-radius: 50%;
				background: var(--control-bg);
			}
			.time-range {
				position: relative;
				height: 36px;
				touch-action: none;
				cursor: pointer;
			}
			.range-track {
				position: absolute;
				top: 16px;
				left: 12px;
				right: 12px;
				height: 4px;
				border-radius: 2px;
				background: var(--panel-border);
				pointer-events: none;
			}
			.range-selection {
				position: absolute;
				left: var(--range-start, 0%);
				right: calc(100% - var(--range-end, 100%));
				height: 100%;
				border-radius: 2px;
				background: var(--accent);
			}
			#playhead {
				position: absolute;
				left: var(--playhead);
				top: -4px;
				width: 2px;
				height: 12px;
				background: var(--panel-text);
			}
			.time-range input {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 36px;
				margin: 0;
				appearance: none;
				background: transparent;
				outline: none;
				pointer-events: none;
			}
			.time-range input:focus-visible {
				z-index: 1;
			}
			.time-range input::-webkit-slider-thumb {
				appearance: none;
				box-sizing: border-box;
				width: 24px;
				height: 24px;
				border: 3px solid var(--panel-bg);
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 0 1px var(--accent);
			}
			.time-range input::-moz-range-thumb {
				box-sizing: border-box;
				width: 24px;
				height: 24px;
				border: 3px solid var(--panel-bg);
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 0 1px var(--accent);
			}
			.time-range input:focus-visible::-webkit-slider-thumb {
				box-shadow: 0 0 0 3px var(--panel-bg), 0 0 0 5px var(--accent);
			}
			.time-range input:focus-visible::-moz-range-thumb {
				box-shadow: 0 0 0 3px var(--panel-bg), 0 0 0 5px var(--accent);
			}
			.time-dates {
				grid-column: 2;
				display: grid;
				grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
				gap: 16px;
			}
			.time-dates label {
				display: grid;
				gap: 2px;
				font-size: 11px;
				color: var(--panel-muted);
			}
			.time-dates input {
				box-sizing: border-box;
				width: 100%;
				min-width: 0;
				border: 1px solid transparent;
				border-radius: 8px;
				background: transparent;
				color: var(--panel-text);
				font: inherit;
				font-size: 12px;
				padding: 4px;
				color-scheme: light dark;
			}
			.time-dates input:hover {
				border-color: var(--panel-border);
				background: var(--control-bg);
			}
			@media (max-width: 600px) {
				.map-sidebar {
					width: calc(100vw - 72px);
				}
				.top-left {
					gap: 8px;
					padding: 12px;
				}
				#desktop-controls,
				#desktop-filters {
					display: none;
				}
				#checkin-count {
					font-size: 16px;
				}
				#location-counts {
					font-size: 11px;
				}
				#display-summary:not(:empty) {
					display: block;
				}
				.filter-actions {
					border: none;
					padding-top: 0;
				}
				#filters-button {
					padding: 8px;
				}
				.time-control {
					padding: 8px 12px;
					grid-template-columns: 44px minmax(0, 1fr);
					column-gap: 8px;
				}
				#time-label {
					display: none;
				}
				#dates-button {
					display: block;
				}
				#dates-button::after {
					content: "⌄";
					margin-left: 8px;
				}
				#dates-button[aria-expanded="true"]::after {
					content: "⌃";
				}
				.time-dates {
					grid-column: 1 / -1;
					gap: 8px;
				}
			}
			@media (pointer: coarse) {
				.panel button,
				.panel input,
				.style-options li,
				.sibling a {
					min-height: 44px;
					box-sizing: border-box;
				}
				.sibling a {
					display: inline-flex;
					align-items: center;
				}
				#legend-info,
				#play-button {
					width: 44px;
				}
				.style-chevron {
					top: 17px;
				}
				.time-range,
				.time-range input {
					height: 44px;
				}
				.range-track {
					top: 20px;
				}
			}
			.map-error {
				position: absolute;
				top: 12px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 2;
				background: #b71c1c;
				color: #fff;
				border-radius: 6px;
				padding: 8px 16px;
				font-family: system-ui, -apple-system, sans-serif;
				font-size: 14px;
			}
			.maplibregl-popup-content {
				font-family: system-ui, -apple-system, sans-serif;
				font-size: 13px;
				line-height: 1.5;
				padding: 10px 14px;
			}
			.popup-venue {
				font-weight: 600;
				font-size: 14px;
				margin-bottom: 2px;
			}
			.popup-muted {
				color: var(--panel-muted);
			}
			/* A hover popup under the cursor would steal the click and flicker on mouseleave. */
			.hover-popup {
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<div class="map-sidebar">
		<div class="panel top-left" id="map-controls" hidden>
			<div class="stats" id="stats" hidden>
				<div class="results-heading">
					<strong id="checkin-count"></strong>
					<!--__UNTAPPD_SIBLING_LINK__-->
				</div>
				<div id="location-counts"></div>
				<div id="display-summary"></div>
			</div>
			<div id="desktop-controls">
			<div id="display-controls">
			<div class="control-group" id="view-toggle" hidden>
				<div class="view-toggle" role="group" aria-label="Map view">
					<button id="bubbles-button" class="active" type="button">Bubbles</button>
					<button id="heatmap-button" type="button">Heatmap</button>
				</div>
			</div>
			<div class="control-group" id="metric-toggle" hidden>
				<div class="view-toggle" role="group" aria-label="Bubble metric">
					<button id="metric-checkins" class="active" type="button">Check-ins</button>
					<button id="metric-abv" type="button">Avg ABV</button>
				</div>
			</div>
			<div class="legend" id="legend" role="group" aria-labelledby="legend-title" hidden>
				<span class="visually-hidden" id="legend-title">Check-ins</span>
				<div class="legend-row">
					<span class="legend-dot" id="legend-dot-1" style="width: 16px; height: 16px; background: #F59E0B;"></span>
					<span id="legend-label-1">1</span>
				</div>
				<div class="legend-row">
					<span class="legend-dot" id="legend-dot-2" style="width: 20px; height: 20px; background: #EA580C;"></span>
					<span id="legend-label-2">2&ndash;4</span>
				</div>
				<div class="legend-row">

		<script type="application/json" id="venue-data">"__UNTAPPD_VENUE_DATA__"</script>
		<script type="module">
			import * as maplibregl from "https://cdn.jsdelivr.net/npm/maplibre-gl@6.0.0/dist/maplibre-gl.mjs";

			const darkScheme = matchMedia("(prefers-color-scheme: dark)");
			// Amber ramps: light validated on the Liberty basemap, dark against
			// the dark style surface (#0c0c0c). Bucket order is 1, 2-4, 5+.
			const themes = {
				light: {
					style: "https://tiles.openfreemap.org/styles/liberty",
					buckets: ["#F59E0B", "#EA580C", "#9A3412"],
					cluster: "#37474F",
					heat: [0, "rgba(245, 158, 11, 0)", 0.15, "#FDE68A", 0.4, "#F59E0B", 0.7, "#EA580C", 1, "#9A3412"],
				},
				dark: {
					style: "https://tiles.openfreemap.org/styles/dark",
					buckets: ["#D97706", "#F59E0B", "#FCD34D"],
					cluster: "#546E7A",
					heat: [0, "rgba(217, 119, 6, 0)", 0.15, "#92400E", 0.4, "#D97706", 0.7, "#F59E0B", 1, "#FCD34D"],
				},
			};
			function currentTheme() {
				return darkScheme.matches ? themes.dark : themes.light;
			}

			// hash: true restores a shared or reloaded view; skip fitBounds then.
			const startedWithHash = location.hash.length > 1;
			const map = new maplibregl.Map({
				container: "map",
				style: currentTheme().style,
				center: [-95, 38],
				zoom: 3,
				hash: true,
				attributionControl: { compact: true },
			});
			map.addControl(new maplibregl.NavigationControl(), "top-right");
			map.addControl(new maplibregl.FullscreenControl(), "top-right");
			// Exposed for driving the map from Playwright.
			window.beermap = map;

			const statsElement = document.getElementById("stats");
			const viewToggleElement = document.getElementById("view-toggle");
			const bubblesButton = document.getElementById("bubbles-button");
			const heatmapButton = document.getElementById("heatmap-button");
			const metricToggleElement = document.getElementById("metric-toggle");
			const metricButtons = {
				checkins: document.getElementById("metric-checkins"),
				abv: document.getElementById("metric-abv"),
			};
			const servingToggleElement = document.getElementById("serving-toggle");
			const styleFilter = document.getElementById("style-filter");
			const styleOptions = document.getElementById("style-options");
			const styleEmpty = document.getElementById("style-empty");
			const styleGroups = new Set();
			const servingButtons = {
				all: document.getElementById("serving-all"),
				draft: document.getElementById("serving-draft"),
				bottle: document.getElementById("serving-bottle"),
				can: document.getElementById("serving-can"),
				cask: document.getElementById("serving-cask"),
			};
			const legendElement = document.getElementById("legend");
			const timeControlElement = document.getElementById("time-control");
			const playButton = document.getElementById("play-button");
			const timeSlider = document.getElementById("time-slider");
			const timeStartSlider = document.getElementById("time-start-slider");
			const timeRange = document.getElementById("time-range");
			const timeLabel = document.getElementById("time-label");
			const dateStart = document.getElementById("date-start");
			const dateEnd = document.getElementById("date-end");
			const mobileLayout = matchMedia("(max-width: 600px)");
			const filtersButton = document.getElementById("filters-button");
			const filterFields = document.getElementById("filter-fields");
			const filterSheet = document.getElementById("filter-sheet");
			const filterChips = document.getElementById("filter-chips");
			const resetFilters = document.getElementById("reset-filters");
			const datesButton = document.getElementById("dates-button");
			const timeDates = document.getElementById("time-dates");
			new ResizeObserver((entries) => {
				document.documentElement.style.setProperty("--map-footer-height", `${entries[0].borderBoxSize[0].blockSize}px`);
			}).observe(map.getContainer().querySelector(".maplibregl-ctrl-bottom-right"));
			new ResizeObserver((entries) => {
				document.documentElement.style.setProperty("--time-control-height", `${entries[0].borderBoxSize[0].blockSize}px`);
			}).observe(timeControlElement);
			const initialParameters = new URLSearchParams(location.search);

			let canonicalFeatures = [];
			let filteredCollection = null;
			const propertiesById = new Map();
			const openPopups = new Map();
			let viewMode = initialParameters.get("view") === "heatmap" ? "heatmap" : "bubbles";
			// "all" keeps every check-in; any other value matches checkin_servings.
			let activeServing = Object.hasOwn(servingButtons, initialParameters.get("serving"))
				? initialParameters.get("serving") : "all";
			let activeStyle = "";
			let timeline = null;
			let playTimer = null;
			let playbackDay = null;
			let urlTimer = null;
			let filterFrame = null;
			const sourceCollections = new Map();

			const metrics = {
				checkins: {
					key: "total_venue_checkins",
					thresholds: [2, 5],
					legendTitle: "Check-ins",
					legendRows: ["1", "2–4", "5+"],
				},
				abv: {
					key: "average_abv",
					thresholds: [5, 7],
					legendTitle: "Avg ABV",
					legendRows: ["<5%", "5–<7%", "≥7%"],
				},
			};
			let activeMetric = Object.hasOwn(metrics, initialParameters.get("metric"))
				? initialParameters.get("metric") : "checkins";

			function updateFilterSummary() {
				document.getElementById("display-summary").textContent = viewMode === "heatmap" ? "Heatmap · Check-ins"
					: activeMetric === "abv" ? "Bubbles · Avg ABV" : "";
				const selection = JSON.stringify([activeServing, activeStyle, timeStartSlider.value, timeSlider.value,
					playbackDay !== null, mobileLayout.matches]);
				if (filterChips.dataset.selection === selection) return;
				filterChips.dataset.selection = selection;
				const filters = [];
				if (activeServing !== "all") {
					const label = servingButtons[activeServing].textContent;
					filters.push(["serving", label, `Remove ${label} serving filter`]);
				}
				if (activeStyle) filters.push(["style", activeStyle, `Remove ${activeStyle} style filter`]);
				if (timeline && (Number(timeStartSlider.value) > 0 || Number(timeSlider.value) < timeline.totalDays)) {
					const start = parseLocalDate(dateStart.value).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
					const end = parseLocalDate(dateEnd.value).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
					const label = Number(timeStartSlider.value) === 0 ? `Through ${end}`
						: Number(timeSlider.value) === timeline.totalDays ? `From ${start}` : `${start} – ${end}`;
					filters.push(["dates", label, "Remove date filter"]);
				}
				if (playbackDay !== null) filters.push(["playback", "Playback", "Clear playback position"]);
				filtersButton.textContent = (mobileLayout.matches ? "Filters & view" : "Filters")
					+ (filters.length ? ` (${filters.length})` : "");
				const focusedFilter = filterChips.contains(document.activeElement) ? document.activeElement.dataset.filter : null;
				filterChips.replaceChildren(...filters.map(([key, label, description]) => {
					const button = document.createElement("button");
					button.type = "button";
					button.dataset.filter = key;
					button.textContent = label;
					button.setAttribute("aria-label", description);
					return button;
				}));
				filterChips.hidden = filters.length === 0;
				resetFilters.hidden = filters.length === 0;
				if (focusedFilter) {
					(filterChips.querySelector(`[data-filter="${focusedFilter}"]`) ?? filterChips.firstElementChild ?? filtersButton).focus();
				}
			}

			const arrangeControls = () => {
				filterSheet.close();
				closeStyleOptions();
				const displayControls = document.getElementById("display-controls");
				if (mobileLayout.matches) {
					document.getElementById("sheet-controls").append(displayControls, filterFields);
					filterFields.hidden = false;
					filtersButton.setAttribute("aria-controls", "filter-sheet");
					filtersButton.setAttribute("aria-haspopup", "dialog");
				} else {
					document.getElementById("desktop-controls").append(displayControls);
					document.getElementById("desktop-filters").append(filterFields);
					filterFields.hidden = true;
					filtersButton.setAttribute("aria-controls", "filter-fields");
					filtersButton.removeAttribute("aria-haspopup");
				}
				filtersButton.setAttribute("aria-expanded", "false");
				timeDates.hidden = mobileLayout.matches;
				datesButton.setAttribute("aria-expanded", "false");
				updateFilterSummary();
			};
			mobileLayout.addEventListener("change", arrangeControls);
			arrangeControls();
			filtersButton.addEventListener("click", () => {
				if (mobileLayout.matches) {
					filterSheet.showModal();
					filtersButton.setAttribute("aria-expanded", "true");
				} else {
					filterFields.hidden = !filterFields.hidden;
					filtersButton.setAttribute("aria-expanded", String(!filterFields.hidden));
					if (filterFields.hidden) closeStyleOptions();
				}
			});
			document.getElementById("close-filters").addEventListener("click", () => filterSheet.close());
			filterSheet.addEventListener("close", () => {
				closeStyleOptions();
				filtersButton.setAttribute("aria-expanded", "false");
			});
			filterSheet.addEventListener("keydown", (event) => {
				if (event.key !== "Tab") return;
				const controls = [...filterSheet.querySelectorAll("button:not(:disabled), input:not(:disabled)")]
					.filter((element) => element.getClientRects().length > 0);
				if (event.shiftKey && document.activeElement === controls[0]) {
					event.preventDefault();
					controls.at(-1).focus();
				} else if (!event.shiftKey && document.activeElement === controls.at(-1)) {
					event.preventDefault();
					controls[0].focus();
				}
			});
			filterSheet.addEventListener("click", (event) => {
				const rectangle = filterSheet.getBoundingClientRect();
				if (event.target === filterSheet && (event.clientY < rectangle.top || event.clientY > rectangle.bottom
					|| event.clientX < rectangle.left || event.clientX > rectangle.right)) filterSheet.close();
			});
			datesButton.addEventListener("click", () => {
				timeDates.hidden = !timeDates.hidden;
				datesButton.setAttribute("aria-expanded", String(!timeDates.hidden));
			});
			document.getElementById("legend-info").addEventListener("click", (event) => {
				const description = document.getElementById("legend-clusters");
				description.hidden = !description.hidden;
				event.currentTarget.setAttribute("aria-expanded", String(!description.hidden));
			});
			filterChips.addEventListener("click", (event) => {
				const button = event.target.closest("button");
				if (!button) return;
				if (button.dataset.filter === "serving") setServing("all");
				else if (button.dataset.filter === "style") setStyleFilter("");
				else if (button.dataset.filter === "dates") document.getElementById("reset-dates").click();
				else if (button.dataset.filter === "playback") {
					pausePlayback();
					updateTimeLabel();
					scheduleCutoff();
				}
			});

			function updateUrl() {
				if (urlTimer !== null) {
					return;
				}
				urlTimer = setTimeout(() => {
					urlTimer = null;
					const url = new URL(location.href);
					for (const [key, value] of Object.entries({
						view: viewMode === "bubbles" ? null : viewMode,
						metric: activeMetric === "checkins" ? null : activeMetric,
						serving: activeServing === "all" ? null : activeServing,
						style: activeStyle || null,
						from: timeline && Number(timeStartSlider.value) > 0
							? new Date(timeline.startMs + Number(timeStartSlider.value) * 86_400_000).toISOString().slice(0, 10) : null,
						through: timeline && Number(timeSlider.value) < timeline.totalDays
							? new Date(timeline.startMs + Number(timeSlider.value) * 86_400_000).toISOString().slice(0, 10) : null,
						at: timeline && playbackDay !== null
							? new Date(timeline.startMs + playbackDay * 86_400_000).toISOString().slice(0, 10) : null,
					})) {
						if (value === null) {
							url.searchParams.delete(key);
						} else {
							url.searchParams.set(key, value);
						}
					}
					if (url.href !== location.href) {
						history.replaceState(history.state, "", url);
					}
				}, 500);
			}

			function bubblePaint(theme, cluster = false) {
				const metric = metrics[activeMetric];
				const value = activeMetric === "abv" && cluster
					? ["/", ["get", "abv_sum"], ["max", 1, ["get", "abv_count"]]]
					: ["coalesce", ["get", metric.key], 0];
				const thresholds = metric.thresholds;
				return {
					"circle-color": [
						"case",
						["all", activeMetric === "abv", ["==", ["get", "abv_count"], 0]],
						"#64748b",
						["step", value, theme.buckets[0], thresholds[0], theme.buckets[1], thresholds[1], theme.buckets[2]],
					],
					"circle-radius": [
						"step",
						value,
						cluster ? 16 : 8,
						thresholds[0],
						cluster ? 20 : 10,
						thresholds[1],
						cluster ? 26 : 12.5,
					],
				};
			}

			function showError(message) {
				if (document.querySelector(".map-error")) {
					return;
				}
				const banner = document.createElement("div");
				banner.className = "map-error";
				banner.textContent = message;
				document.body.appendChild(banner);
			}

			// A bare YYYY-MM-DD parses as UTC midnight, which renders as the previous
			// day in western timezones; force local time.
			function parseLocalDate(raw) {
				const text = String(raw).replace(" ", "T");
				return new Date(text.includes("T") ? text : `${text}T00:00:00`);
			}

			function formatDate(raw) {
				const date = parseLocalDate(raw);
				if (Number.isNaN(date.getTime())) {
					return raw;
				}
				return date.toLocaleDateString("en-US", {
					year: "numeric",
					month: "long",
					day: "numeric",
				});
			}

			function countNoun(count, singular, plural = `${singular}s`) {
				return `${count.toLocaleString("en-US")} ${count === 1 ? singular : plural}`;
			}

			function popupContent(properties) {
				properties = { ...properties };
				const beers = new Set();
				const breweries = new Set();
				const styles = new Map();
				for (const checkin of properties.checkins) {
					if (checkin.beer?.id) beers.add(checkin.beer.id);
					if (checkin.beer?.brewery) breweries.add(checkin.beer.brewery);
					if (checkin.style) styles.set(checkin.style, (styles.get(checkin.style) ?? 0) + 1);
					if (checkin.beer?.name) {
						properties.last_beer_name = checkin.beer.name;
						properties.last_beer_brewery = checkin.beer.brewery;
					}
					if (checkin.time !== null) {
						if (properties.first_checkin) properties.last_checkin = checkin.date;
						else properties.first_checkin = checkin.date;
					}
				}
				properties.unique_beers = beers.size;
				properties.unique_breweries = breweries.size;
				properties.top_styles = [...styles].sort((first, second) => second[1] - first[1])
					.slice(0, 3).map(([style]) => style);
				const container = document.createElement("div");

				const venue = document.createElement("div");
				venue.className = "popup-venue";
				venue.textContent = properties.venue_name ?? "Unknown venue";
				container.appendChild(venue);

				const locationParts = [
					properties.venue_city,
					properties.venue_state,
					properties.venue_country,
				].filter(Boolean);
				if (locationParts.length > 0) {
					const place = document.createElement("div");
					place.className = "popup-muted";
					place.textContent = locationParts.join(", ");
					container.appendChild(place);
				}

				if (properties.last_beer_name) {
					const lastBeer = document.createElement("div");
					const beerParts = [properties.last_beer_name, properties.last_beer_brewery].filter(Boolean);
					const label = (properties.total_venue_checkins ?? 1) > 1 ? "Last beer" : "Beer";
					lastBeer.textContent = `${label}: ${beerParts.join(" · ")}`;
					container.appendChild(lastBeer);
				}

				const countParts = [countNoun(properties.total_venue_checkins ?? 1, "check-in")];
				if (properties.unique_beers) {
					countParts.push(countNoun(properties.unique_beers, "beer"));
				}
				if (properties.unique_breweries) {
					countParts.push(countNoun(properties.unique_breweries, "brewery", "breweries"));
				}
				if (properties.average_abv) {
					countParts.push(`${properties.average_abv.toFixed(1)}% avg ABV`);
				} else {
					countParts.push("ABV unavailable");
				}
				const counts = document.createElement("div");
				counts.textContent = countParts.join(" · ");
				container.appendChild(counts);
				if (properties.abv_count > 0 && properties.abv_count < properties.total_venue_checkins) {
					const coverage = document.createElement("div");
					coverage.className = "popup-muted";
					coverage.textContent = `ABV listed for ${properties.abv_count} of ${properties.total_venue_checkins} check-ins`;
					container.appendChild(coverage);
				}

				// Rendered features carry arrays as JSON strings; canonical ones as arrays.
				let topStyles = properties.top_styles;
				if (typeof topStyles === "string") {
					try {
						topStyles = JSON.parse(topStyles);
					} catch {
						topStyles = null;
					}
				}
				if (Array.isArray(topStyles) && topStyles.length > 0) {
					const styles = document.createElement("div");
					styles.className = "popup-muted";
					styles.textContent = topStyles.join(" · ");
					container.appendChild(styles);
				}

				if (properties.first_checkin) {
					const first = document.createElement("div");
					first.className = "popup-muted";
					first.textContent = `First: ${formatDate(properties.first_checkin)}`;
					container.appendChild(first);
				}
				if (properties.last_checkin) {
					const last = document.createElement("div");
					last.className = "popup-muted";
					last.textContent = `Last: ${formatDate(properties.last_checkin)}`;
					container.appendChild(last);
				}

				return container;
			}

			function parseCheckinTime(raw) {
				const time = Date.parse(String(raw).slice(0, 10));
				return Number.isFinite(time) ? time : null;
			}

			function prepareFeatures(venues) {
				canonicalFeatures = venues.features
					.filter((feature) => Array.isArray(feature?.geometry?.coordinates))
					.map((feature, index) => {
						feature.properties = { ...feature.properties, venue_id: index };
						// Only checkin_dates drives the timeline. A file from before that
						// field existed gets no slider instead of counts fabricated from
						// the first/last dates.
						const dates = Array.isArray(feature.properties.checkin_dates)
							? feature.properties.checkin_dates
							: [];
						// checkin_servings is positional against checkin_dates.
						const servings = Array.isArray(feature.properties.checkin_servings)
							? feature.properties.checkin_servings
							: [];
						const styles = feature.properties.checkin_styles ?? [];
						const beers = feature.properties.checkin_beers ?? [];
						const checkins = [];
						for (const [position, date] of dates.entries()) {
							const time = parseCheckinTime(date);
							const beer = beers[position];
							checkins.push({
								time,
								date,
								serving: String(servings[position] ?? "").toLowerCase(),
								style: String(styles[position] ?? ""),
								styleGroup: String(styles[position] ?? "").split(" - ")[0],
								beer,
								abv: Number.isFinite(beer?.abv) && beer.abv > 0 ? beer.abv : 0,
							});
						}
						checkins.sort((first, second) => first.time - second.time);
						return { feature, checkins };
					});
			}

			function hasServingData() {
				return canonicalFeatures.some(({ checkins }) =>
					checkins.some((checkin) => checkin.serving !== ""),
				);
			}

			function applyCutoff(cutoffMs) {
				if (filterFrame !== null) {
					cancelAnimationFrame(filterFrame);
					filterFrame = null;
				}
				const startMs = timeline && Number(timeStartSlider.value) > 0
					? timeline.startMs + Number(timeStartSlider.value) * 86_400_000 : -Infinity;
				const features = [];
				propertiesById.clear();
				for (const { feature, checkins } of canonicalFeatures) {
					// A file from before the per-check-in fields existed cannot be filtered.
					const matchingCheckins = checkins.filter((checkin) =>
						(checkin.time === null ? startMs === -Infinity && cutoffMs === Infinity
							: checkin.time >= startMs && checkin.time <= cutoffMs)
						&& (activeServing === "all" || checkin.serving === activeServing)
						&& (activeStyle === "" || checkin.styleGroup === activeStyle),
					);
					if (matchingCheckins.length === 0) continue;
					const properties = {
						venue_id: feature.properties.venue_id,
						venue_name: feature.properties.venue_name,
						venue_city: feature.properties.venue_city,
						venue_state: feature.properties.venue_state,
						venue_country: feature.properties.venue_country,
						total_venue_checkins: matchingCheckins.length,
						abv_sum: 0,
						abv_count: 0,
						average_abv: undefined,
						checkins: matchingCheckins,
					};
					for (const checkin of matchingCheckins) {
						if (checkin.abv > 0) {
							properties.abv_sum += checkin.abv;
							properties.abv_count += 1;
						}
					}
					if (properties.abv_count) properties.average_abv = properties.abv_sum / properties.abv_count;
					propertiesById.set(properties.venue_id, properties);
					const previous = filteredCollection?.features[features.length];
					if (previous?.properties.venue_id === properties.venue_id
						&& previous.geometry === feature.geometry
						&& previous.properties.total_venue_checkins === properties.total_venue_checkins
						&& previous.properties.abv_sum === properties.abv_sum
						&& previous.properties.abv_count === properties.abv_count) {
						features.push(previous);
						continue;
					}
					features.push({
						type: "Feature",
						geometry: feature.geometry,
						properties: {
							venue_id: properties.venue_id,
							total_venue_checkins: properties.total_venue_checkins,
							average_abv: properties.average_abv,
							abv_sum: properties.abv_sum,
							abv_count: properties.abv_count,
						},
					});
				}
				if (filteredCollection?.features.length !== features.length
					|| features.some((feature, index) => feature !== filteredCollection.features[index])) {
					filteredCollection = { type: "FeatureCollection", features };
				}
				const identifier = viewMode === "bubbles" ? "venues" : "venues-heat";
				const source = map.getSource(identifier);
				if (source && sourceCollections.get(identifier) !== filteredCollection) {
					source.setData(filteredCollection);
					sourceCollections.set(identifier, filteredCollection);
				}
				for (const [popup, venueId] of openPopups) {
					const properties = propertiesById.get(venueId);
					if (properties) popup.setDOMContent(popupContent(properties));
					else popup.remove();
				}
				updateStats();
				updateUrl();
			}

			function setupTimeline() {
				// A loop, not Math.min(...spread): engines throw past ~65k arguments.
				let startMs = Infinity;
				let endMs = -Infinity;
				for (const { checkins } of canonicalFeatures) {
					for (const { time } of checkins) {
						if (time === null) continue;
						if (time < startMs) startMs = time;
						if (time > endMs) endMs = time;
					}
				}
				if (!Number.isFinite(startMs)) {
					return;
				}
				const totalDays = Math.ceil((endMs - startMs) / 86_400_000);
				timeline = { startMs, endMs, totalDays };
				dateStart.min = dateEnd.min = new Date(startMs).toISOString().slice(0, 10);
				dateStart.max = dateEnd.max = new Date(endMs).toISOString().slice(0, 10);
				dateStart.value = initialParameters.get("from") ?? dateStart.min;
				dateEnd.value = initialParameters.get("through") ?? dateEnd.max;
				dateStart.valueAsNumber = Math.max(startMs, Math.min(endMs,
					Number.isFinite(dateStart.valueAsNumber) ? dateStart.valueAsNumber : startMs));
				dateEnd.valueAsNumber = Math.max(startMs, Math.min(endMs,
					Number.isFinite(dateEnd.valueAsNumber) ? dateEnd.valueAsNumber : endMs));
				if (dateStart.value > dateEnd.value) dateEnd.value = dateStart.value;
				timeStartSlider.max = String(totalDays);
				timeStartSlider.value = String((dateStart.valueAsNumber - startMs) / 86_400_000);
				timeSlider.max = String(totalDays);
				timeSlider.value = String((dateEnd.valueAsNumber - startMs) / 86_400_000);
				const sharedPlayback = Date.parse(initialParameters.get("at") ?? "");
				if (Number.isFinite(sharedPlayback)) {
					playbackDay = Math.max(Number(timeStartSlider.value), Math.min(Number(timeSlider.value),
						Math.round((sharedPlayback - startMs) / 86_400_000)));
				}
				timeStartSlider.disabled = totalDays === 0;
				timeSlider.disabled = totalDays === 0;
				playButton.disabled = totalDays === 0;
				timeControlElement.hidden = false;
				updateTimeLabel();

				for (const slider of [timeStartSlider, timeSlider]) {
					slider.addEventListener("input", () => {
						pausePlayback();
						slider.value = String(slider === timeStartSlider
							? Math.min(Number(slider.value), Number(timeSlider.value))
							: Math.max(Number(slider.value), Number(timeStartSlider.value)));
						updateTimeLabel();
						scheduleCutoff();
					});
				}

				let draggedSlider = null;
				let rangePointerId = null;
				for (const eventName of ["pointerdown", "pointermove"]) {
					timeRange.addEventListener(eventName, (event) => {
						if (!event.isPrimary || totalDays === 0) return;
						if (event.type === "pointerdown" && event.button !== 0) return;
						if (event.type === "pointermove" && event.pointerId !== rangePointerId) return;
						const rectangle = timeRange.getBoundingClientRect();
						const fraction = Math.max(0, Math.min(1,
							(event.clientX - rectangle.left - 12) / (rectangle.width - 24),
						));
						const value = Math.round(fraction * totalDays);
						if (event.type === "pointerdown") {
							draggedSlider = fraction * totalDays < (Number(timeStartSlider.value) + Number(timeSlider.value)) / 2

							timeRange.setPointerCapture(event.pointerId);

					});
				}
				timeRange.addEventListener("lostpointercapture", () => {
					draggedSlider = null;
					rangePointerId = null;
				});

					input.addEventListener("focus", () => pausePlayback(true));

						if (event.type === "change" && (!input.validity.valid || !Number.isFinite(input.valueAsNumber))) return;
						pausePlayback();

							Number.isFinite(input.valueAsNumber) ? input.valueAsNumber
								: input === dateStart ? startMs : endMs,
						));
						if (dateStart.value > dateEnd.value) {
							if (input === dateStart) dateEnd.value = dateStart.value;
							else dateStart.value = dateEnd.value;
						}
						timeStartSlider.value = String((dateStart.valueAsNumber - startMs) / 86_400_000);
						timeSlider.value = String((dateEnd.valueAsNumber - startMs) / 86_400_000);
						updateTimeLabel();
						applyCutoff(sliderCutoff());

					input.addEventListener("change", commitDateRange);
					input.addEventListener("blur", commitDateRange);
					input.addEventListener("keydown", (event) => {

					});
				}
				document.getElementById("reset-dates").addEventListener("click", () => {
					pausePlayback();
					timeStartSlider.value = "0";
					timeSlider.value = String(totalDays);
					updateTimeLabel();
					applyCutoff(Infinity);

				playButton.addEventListener("click", () => {
					if (playTimer) {

					}

			map.on("load", async () => {

				let venues;
				try {
					// The data is inlined by default. ?data= lets an embedding page point at a
					// separately cached copy instead; CSP limits it to same-origin.
					const dataUrl = new URLSearchParams(location.search).get("data");
					if (dataUrl) {
						const response = await fetch(dataUrl);
						if (!response.ok) {
							throw new Error(`HTTP ${response.status}`);
						}
						venues = await response.json();
					} else {
						venues = JSON.parse(document.getElementById("venue-data").textContent);
					}
					if (!Array.isArray(venues?.features)) {
						throw new Error("venue data is not a FeatureCollection");
					}
				} catch (error) {
					console.error(error);
					showError("Could not load venue data");
					return;
				}

				prepareFeatures(venues);
				const styles = new Set();
				for (const { checkins } of canonicalFeatures) {
					for (const { styleGroup } of checkins) {
						if (styleGroup) styles.add(styleGroup);
					}
				}
				for (const style of [...styles].sort((first, second) => first.localeCompare(second))) {
					styleGroups.add(style);
				}
				styleFilter.value = styles.has(initialParameters.get("style"))
					? initialParameters.get("style") : "";
				activeStyle = styleFilter.value;
				styleFilter.value = activeStyle || "All styles";
				document.getElementById("style-control").hidden = styles.size === 0;
				setupTimeline();
				applyCutoff(currentCutoff());
				addMapData();
				setMetric(activeMetric);
				setViewMode(viewMode);
				for (const [servingName, button] of Object.entries(servingButtons)) {
					button.classList.toggle("active", servingName === activeServing);
					button.setAttribute("aria-pressed", String(servingName === activeServing));
				}
				document.getElementById("map-controls").hidden = false;
				viewToggleElement.hidden = false;
				metricToggleElement.hidden = viewMode !== "bubbles";
				servingToggleElement.hidden = !hasServingData();
				legendElement.hidden = viewMode !== "bubbles";

				if (!startedWithHash) {
					const bounds = new maplibregl.LngLatBounds();
					for (const { feature } of canonicalFeatures) {
						bounds.extend(feature.geometry.coordinates);
					}
					if (!bounds.isEmpty()) {
						map.fitBounds(bounds, { padding: 48, maxZoom: 10 });
					}
				}

				map.on("click", "clusters", async (event) => {
					const feature = event.features[0];
					let zoom;
					try {
						zoom = await map
							.getSource("venues")
							.getClusterExpansionZoom(feature.properties.cluster_id);
					} catch (error) {
						console.error(error);
						return;
					}
					map.easeTo({ center: feature.geometry.coordinates, zoom });
				});

				// Keep the default double-click zoom from interrupting cluster expansion.
				map.on("dblclick", "clusters", (event) => {
					event.preventDefault();
				});

				let hoverPopup = null;
				let hoverVenueId = null;
				function clearHoverPopup() {
					hoverPopup?.remove();
					hoverPopup = null;
					hoverVenueId = null;
				}
				if (matchMedia("(hover: hover)").matches) {
					map.on("mousemove", "venue-points", (event) => {
						const feature = event.features[0];
						const venueId = feature.properties.venue_id;
						const properties = propertiesById.get(venueId);
						if (!properties) return;
						if (venueId === hoverVenueId) {
							return;
						}
						clearHoverPopup();
						hoverVenueId = venueId;
						hoverPopup = new maplibregl.Popup({
							closeButton: false,
							closeOnClick: false,
							maxWidth: "320px",
							offset: 12,
							className: "hover-popup",
						})
							.setLngLat(feature.geometry.coordinates)
							.setDOMContent(popupContent(properties))
							.addTo(map);
						const popup = hoverPopup;
						openPopups.set(popup, venueId);
						popup.on("close", () => openPopups.delete(popup));
					});
					map.on("mouseleave", "venue-points", clearHoverPopup);
				}

				map.on("click", "venue-points", (event) => {
					clearHoverPopup();
					const feature = event.features[0];
					const properties = propertiesById.get(feature.properties.venue_id);
					if (!properties) return;
					const popup = new maplibregl.Popup({ maxWidth: "320px" })
						.setLngLat(feature.geometry.coordinates)
						.setDOMContent(popupContent(properties))
						.addTo(map);
					openPopups.set(popup, feature.properties.venue_id);
					popup.on("close", () => openPopups.delete(popup));
				});

				for (const layer of ["clusters", "venue-points"]) {
					map.on("mouseenter", layer, () => {
						map.getCanvas().style.cursor = "pointer";
					});
					map.on("mouseleave", layer, () => {
						map.getCanvas().style.cursor = "";
					});
				}
			});
		</script>
	</body>
</html>
